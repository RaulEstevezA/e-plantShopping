name: Deploy E-Plant to portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-e-plant-to-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout E-Plant
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify Cloudflare Web Analytics beacon
        run: |
          status=0
          files=$(find dist -name '*.html')
          if [ -z "$files" ]; then
            echo "::error::No HTML files found in dist/."
            exit 1
          fi
          for file in $files; do
            count=$(grep -o 'static.cloudflareinsights.com/beacon.min.js' "$file" | wc -l | tr -d ' ')
            if [ "$count" -ne 1 ]; then
              echo "::error file=$file::Expected the Cloudflare Web Analytics beacon exactly once, found $count."
              status=1
            else
              echo "$file: beacon found once."
            fi
          done
          exit $status

      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          repository: RaulEstevezA/RaulEstevezA.github.io
          ref: main
          token: ${{ secrets.PORTFOLIO_DEPLOY_TOKEN }}
          path: portfolio

      - name: Synchronize compiled application
        run: |
          mkdir -p portfolio/demos/e-plantShopping
          rsync -a --delete dist/ portfolio/demos/e-plantShopping/

      - name: Commit and push changes
        working-directory: portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- demos/e-plantShopping/

          if git diff --cached --quiet; then
            echo "The compiled application has not changed; nothing to commit."
            exit 0
          fi

          git commit -m "Deploy E-Plant"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; retrying after updating main."
              sleep 5
            fi
          done

          echo "Unable to push the deployment after 3 attempts."
          exit 1
